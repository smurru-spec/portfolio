<html lang="it">
<head>

<link rel="icon" type="image/png" href="assets/favicon.png" />
<style>
/* ===== stili specifici della pagina progetto ===== */

.p-hero{padding:clamp(110px,14vw,190px) var(--pad) clamp(30px,4vw,50px)}
.p-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:clamp(20px,3vw,40px);color:var(--muted)}
.p-top a{transition:color .2s}
.p-top a:hover{color:var(--ink)}
.p-hero h1{font-size:clamp(56px,11vw,190px);font-weight:800;letter-spacing:-.065em;line-height:.86}
.p-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px;margin-top:clamp(30px,4vw,56px);padding-top:18px;border-top:1px solid var(--line)}
.p-meta .mono{color:var(--muted);display:block;margin-bottom:6px}
.p-meta div{font-size:14px;line-height:1.45}

.p-cover{margin:0 var(--pad);aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;position:relative;background:#ddd;
  clip-path:inset(10% 6% 10% 6% round 20px);transform:scale(.96);transition:clip-path 1.6s var(--ease),transform 1.6s var(--ease)}
.p-cover.in{clip-path:inset(0 0 0 0 round 12px);transform:none}
.p-cover img{position:absolute;left:0;top:-8%;width:100%;height:116%;object-fit:cover;will-change:transform}
.p-cover .over{position:absolute;inset:0;display:flex;align-items:flex-end;padding:4%;color:#fff;font-weight:800;letter-spacing:-.06em;font-size:clamp(48px,9vw,150px);line-height:.85;text-shadow:0 2px 30px rgba(0,0,0,.25)}

.p-intro{display:grid;grid-template-columns:1fr 2fr;gap:clamp(30px,5vw,80px);padding:clamp(80px,10vw,150px) var(--pad)}
.p-intro .mono{color:var(--muted);padding-top:.6em}
.p-intro .big{font-size:clamp(26px,2.9vw,46px);font-weight:400;letter-spacing:-.035em;line-height:1.12}
.p-intro .small{display:grid;grid-template-columns:auto 1fr;gap:20px;margin-top:clamp(30px,4vw,50px);padding-top:20px;border-top:1px solid var(--line)}
.p-intro .small p{font-size:15px;line-height:1.7;color:#444;max-width:60ch}

.p-gallery{display:flex;flex-direction:column;gap:clamp(12px,1.4vw,20px);padding:0 var(--pad)}
.g-row{display:grid;gap:clamp(12px,1.4vw,20px)}
.g-row.full{grid-template-columns:1fr}
.g-row.two{grid-template-columns:1fr 1fr}
.g-row.three{grid-template-columns:repeat(3,1fr)}
.g-item{border-radius:var(--radius);overflow:hidden;position:relative;background:#ddd;
  transform:scale(.92);clip-path:inset(8% 8% 8% 8% round 18px);transition:transform 1.3s var(--ease),clip-path 1.3s var(--ease)}
.g-item.in{transform:none;clip-path:inset(0 0 0 0 round 12px)}
.g-row{align-items:start}
.g-item img{display:block;width:100%;height:auto;transform:scale(1.15);transition:transform 1.8s var(--ease)}
.g-item.in img{transform:scale(1)}

.p-palette{padding:clamp(80px,10vw,150px) var(--pad) 0}
.p-palette .mono{color:var(--muted);margin-bottom:20px;display:block}
.swatches{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:clamp(8px,1vw,14px);height:clamp(160px,22vw,320px);align-items:end}
.sw{height:0;border-radius:var(--radius);display:flex;align-items:flex-end;padding:14px;transition:height 1.2s var(--ease);border:1px solid rgba(0,0,0,.06)}
.p-palette.in .sw{height:100%}
.sw .mono{margin:0;opacity:.85}

.p-result{padding:clamp(80px,10vw,150px) var(--pad);display:grid;grid-template-columns:2fr 1fr;gap:clamp(30px,5vw,80px);align-items:end}
.p-result h2{font-size:clamp(40px,6vw,100px);font-weight:300;letter-spacing:-.055em;line-height:.95}
.p-result h2 .lr:nth-child(2) b,.p-result h2 b{font-weight:800}
.stats{display:flex;flex-direction:column}
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--line)}
.stat:first-child{border-top:1px solid var(--line)}
.stat strong{font-size:clamp(28px,3vw,46px);font-weight:700;letter-spacing:-.05em}
.stat .mono{color:var(--muted)}

.p-next{display:block;margin:0 var(--pad) clamp(50px,6vw,90px);background:var(--dark);color:var(--dark-ink);border-radius:20px;padding:clamp(26px,3.5vw,50px);position:relative;overflow:hidden;min-height:clamp(260px,32vw,460px)}
.p-next .mono{color:var(--on-dark-muted);display:flex;justify-content:space-between}
.p-next h3{position:relative;z-index:2;font-size:clamp(54px,10vw,170px);font-weight:800;letter-spacing:-.065em;line-height:.86;margin-top:clamp(40px,8vw,130px);transition:transform .7s var(--ease)}
.p-next .nimg{position:absolute;right:clamp(20px,3vw,50px);top:50%;width:clamp(160px,22vw,320px);aspect-ratio:4/5;border-radius:10px;overflow:hidden;transform:translateY(-50%) rotate(4deg) scale(.85);opacity:.55;transition:transform .8s var(--ease),opacity .5s}
.p-next .nimg img{width:100%;height:100%;object-fit:cover}
.p-next:hover h3{transform:translateX(14px)}
.p-next:hover .nimg{transform:translateY(-50%) rotate(0) scale(1);opacity:1}
.p-next .arrow{position:absolute;right:clamp(26px,3.5vw,50px);bottom:clamp(22px,3vw,40px);font-size:clamp(30px,4vw,60px);z-index:2}

.p-film{padding:0 var(--pad) clamp(60px,8vw,110px)}
.p-film > .mono{color:var(--muted);display:block;margin-bottom:16px}
.film-frame{position:relative;aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;background:#000}
.film-frame iframe,.film-frame video{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:contain}
.p-credits{display:grid;grid-template-columns:1fr 2fr;gap:clamp(30px,5vw,80px);padding:0 var(--pad) clamp(60px,8vw,110px)}
.p-credits > .mono{color:var(--muted)}
.p-credits .cr{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.p-credits .cr:first-child{border-top:1px solid var(--line)}
.p-credits .cr .mono{color:var(--muted)}
.p-cover video{position:absolute;left:0;top:-8%;width:100%;height:116%;object-fit:cover}
.film-frame.vertical{aspect-ratio:9/16;width:min(100%,calc(86vh * 9 / 16));margin:0 auto}
.p-film{display:flex;flex-direction:column}
.film-text{font-size:15px;line-height:1.6;max-width:60ch;margin:-4px 0 18px;color:var(--muted)}
.p-result.solo{grid-template-columns:1fr}
.p-meta a.ext{border-bottom:1px solid currentColor;transition:opacity .2s}
.p-meta a.ext:hover{opacity:.6}
@media (max-width:560px){
  .p-hero h1{font-size:10.5vw;overflow-wrap:anywhere}
  .p-next h3{font-size:10.5vw;overflow-wrap:anywhere}
}
footer.p-foot{padding-top:clamp(40px,5vw,70px);border-radius:22px 22px 0 0}

@media (max-width:900px){
  .p-meta{grid-template-columns:1fr 1fr}
  .p-intro,.p-result{grid-template-columns:1fr}
  .g-row.three{grid-template-columns:1fr 1fr}
  .p-next .nimg{display:none}
}
@media (max-width:560px){
  .g-row.two,.g-row.three{grid-template-columns:1fr}
  .swatches{grid-auto-flow:row;height:auto}
  .sw,.p-palette.in .sw{height:80px}
}
</style>
</head>

<script>
/* ---------- quale progetto? (project.html?p=slug) ---------- */
const slug = new URLSearchParams(location.search).get("p");
const idx  = PROJECTS.findIndex(p=>p.slug===slug);
if(idx<0){ location.replace("index.html#work"); }
const P = PROJECTS[idx] || PROJECTS[0];
const NEXT = PROJECTS[(idx+1)%PROJECTS.length];
const pad2 = n=>String(n).padStart(2,"0");
document.title = `${L(P.name)} — Sara Murru`;

/* ---------- galleria: righe da 1, 2 o 3 immagini, senza ritagli ---------- */
const NAME = L(P.name);
const gallery = (P.rows||[]).map(r=>{
  const cls = r.length===1?"full":(r.length===2?"two":"three");
  return `<div class="g-row ${cls}">${r.map((src,i)=>`<div class="g-item" style="transition-delay:${i*.09}s"><img src="${src}" alt="${NAME}" loading="lazy"></div>`).join("")}</div>`;
}).join("");
const meta = [["p.context",L(P.context)],["p.client",L(P.client)],["p.year",P.year],["p.services",(L(P.services)||[]).join("<br>")],["p.location",L(P.location)]]
  .filter(([,v])=>v).map(([k,v])=>`<div><span class="mono">${t(k)}</span>${v}</div>`).join("")
  + (P.link?`<div><span class="mono">Online</span><a class="ext" href="${P.link}" target="_blank" rel="noopener">${t("p.visit")} ↗</a></div>`:"");

/* ---------- pagina ---------- */
document.getElementById("page").innerHTML = `
  <header class="p-hero" id="top">
    <div class="p-top mono fade">
      <a href="index.html#work" class="back">${t("p.back")}</a>
      <span>${t("p.project")} ${pad2(idx+1)} / ${pad2(PROJECTS.length)}</span>
    </div>
    <h1 class="rv"><span class="lr"><span>${NAME}</span></span></h1>
    <div class="p-meta fade">${meta}</div>
  </header>

  <div class="p-cover" id="cover"><img src="${P.cover}" alt="${NAME}"></div>

  <section class="p-intro">
    <div class="mono fade">${t("p.brief")}</div>
    <div>
      <p class="big fade">${L(P.wish)}</p>
      <div class="small fade">
        <span class="mono" style="color:var(--muted)">${t("p.approach")}</span>
        <p>${L(P.approach)}</p>
      </div>
    </div>
  </section>

  ${filmBlock()}
  ${creditsBlock()}
  <section class="p-gallery">${gallery}</section>

  ${P.palette?`<section class="p-palette" id="palette">
    <span class="mono">${t("p.palette")}</span>
    <div class="swatches">${P.palette.map((c,i)=>`<div class="sw" style="background:${c};color:${contrast(c)};transition-delay:${i*.1}s"><span class="mono">${c.toUpperCase()}</span></div>`).join("")}</div>
  </section>`:""}

  ${P.result?`<section class="p-result${P.stats?"":" solo"}">
    <h2 class="rv">${L(P.result).map((l,i)=>`<span class="lr"><span>${i===1?`<b>${l}</b>`:l}</span></span>`).join("")}</h2>
    ${P.stats?`<div class="stats fade">${L(P.stats).map(([n,l])=>`<div class="stat"><strong>${n}</strong><span class="mono">${l}</span></div>`).join("")}</div>`:""}
  </section>`:`<div style="height:clamp(60px,8vw,120px)"></div>`}

  <a data-dark class="p-next fade" href="project.html?p=${NEXT.slug}">
    <div class="mono"><span>${t("p.next")}</span><span>${L(NEXT.tags).join(" · ")}</span></div>
    <h3>${L(NEXT.name)}</h3>
    <div class="nimg"><img src="${NEXT.card}" alt="${L(NEXT.name)}"></div>
    <span class="arrow">→</span>
  </a>`;

/* ---------- video completo: Vimeo, YouTube o file .mp4 ---------- */
function embedUrl(u){
  let m;
  if((m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/))) return `https://player.vimeo.com/video/${m[1]}?title=0&byline=0&portrait=0`;
  if((m=u.match(/(?:youtu\.be\/|v=|shorts\/)([\w-]{11})/))) return `https://www.youtube-nocookie.com/embed/${m[1]}?rel=0`;
  return null;
}
function filmBlock(){
  /* più video: films:[{src, poster, duration, vertical, label:{it,en}}]  —  un solo video: video/poster/duration/vertical */
  const films = P.films || (P.video ? [{src:P.video, poster:P.poster||P.cover, duration:P.duration, vertical:P.vertical}] : []);
  return films.map(f=>{
    const e=embedUrl(f.src);
    const player=e?`<iframe src="${e}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="${NAME}"></iframe>`
                  :`<video src="${f.src}" poster="${f.poster||""}" controls playsinline preload="metadata"></video>`;
    const label=[f.label?L(f.label):t("p.film"), f.duration].filter(Boolean).join(" — ");
    return `<section class="p-film"><span class="mono fade">( ${label} )</span>${f.text?`<p class="film-text fade">${L(f.text)}</p>`:""}<div class="film-frame fade${f.vertical?" vertical":""}">${player}</div></section>`;
  }).join("");
}
function creditsBlock(){
  if(!P.credits||!P.credits.length) return "";
  return `<section class="p-credits fade"><span class="mono">${t("p.credits")}</span><div>${P.credits.map(([r,n])=>`<div class="cr"><span class="mono">${L(r)}</span><span>${n}</span></div>`).join("")}</div></section>`;
}

function contrast(hex){
  const h=hex.replace("#",""), r=parseInt(h.substr(0,2),16), g=parseInt(h.substr(2,2),16), b=parseInt(h.substr(4,2),16);
  return (r*299+g*587+b*114)/1000 > 150 ? "#111" : "#f4f2ee";
}

/* ---------- lingua, tema, smooth scroll ---------- */
applyI18n();
initLang();
initTheme();
let lenis=null;
if(window.Lenis){ lenis=new Lenis({lerp:.09,smoothWheel:true}); }
document.getElementById("toTop").addEventListener("click",e=>{e.preventDefault(); lenis?lenis.scrollTo(0):scrollTo({top:0,behavior:"smooth"})});

/* ---------- transizione in uscita verso altre pagine del sito ---------- */
document.querySelectorAll('a[href^="index.html"],a[href^="project.html"]').forEach(a=>a.addEventListener("click",e=>{
  if(e.metaKey||e.ctrlKey) return;
  e.preventDefault(); document.getElementById("pageOut").classList.add("on");
  setTimeout(()=>location.href=a.getAttribute("href"),650);
}));
addEventListener("pageshow",e=>{ if(e.persisted) document.getElementById("pageOut").classList.remove("on"); });

/* ---------- reveal ---------- */
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(!e.isIntersecting) return; e.target.classList.add("in"); io.unobserve(e.target);
}),{threshold:.15,rootMargin:"0px 0px -6% 0px"});
document.querySelectorAll(".rv,.fade,.g-item,#cover,#palette,.mega-sub").forEach(el=>io.observe(el));

/* ---------- footer: lettere giganti ---------- */
const megaWord=document.getElementById("megaWord");
megaWord.innerHTML=[..."Sara Murru"].map(ch=>`<span>${ch}</span>`).join("");
const megaLetters=[...megaWord.children];

/* ---------- loop: parallax copertina + lettere footer ---------- */
const coverImg=document.querySelector("#cover img, #cover video");
function raf(t){
  if(lenis) lenis.raf(t);
  const r=coverImg.parentElement.getBoundingClientRect();
  if(r.bottom>0 && r.top<innerHeight){
    const p=(r.top+r.height/2-innerHeight/2)/innerHeight;
    coverImg.style.transform=`translate3d(0,${p*-10}%,0)`;
  }
  const mr=megaWord.getBoundingClientRect();
  const mp=Math.min(Math.max((innerHeight-mr.top)/(mr.height*1.6),0),1);
  megaLetters.forEach((l,i)=>{
    const k=Math.min(Math.max(mp*2.2-i*.1,0),1);
    l.style.transform=`translate3d(0,${Math.pow(1-k,3)*100}%,0)`;
  });
  requestAnimationFrame(raf);
}
requestAnimationFrame(raf);
</script>
</body>
